<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intent Annotator</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-block">
      <strong>Intent Annotator</strong>
      <span id="saveState" class="status-badge">已保存</span>
    </div>
    <div class="header-controls">
      <label class="compact-field mode-field">
        <span>模式</span>
        <select id="modeSelect">
          <option value="annotation">人工标注</option>
          <option value="adjudication">差异仲裁</option>
        </select>
      </label>
      <label id="annotatorField" class="compact-field">
        <span>标注者</span>
        <select id="annotatorSelect"></select>
      </label>
      <button id="previousSample" class="icon-button" type="button" title="上一页" aria-label="上一页">←</button>
      <label class="compact-field sample-field">
        <span>样本</span>
        <select id="sampleSelect"></select>
      </label>
      <button id="nextSample" class="icon-button" type="button" title="下一页" aria-label="下一页">→</button>
      <span id="progressText" class="progress-text"></span>
      <button id="saveButton" class="secondary-button" type="button">保存草稿</button>
      <button id="submitButton" class="primary-button" type="button">提交完成</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="left-panel">
      <div class="panel-tabs" role="tablist">
        <button class="panel-tab active" data-tab="nodes" type="button">节点</button>
        <button class="panel-tab" data-tab="entities" type="button">实体</button>
        <button class="panel-tab" data-tab="tokens" type="button">Token</button>
        <button id="differencesTabButton" class="panel-tab hidden" data-tab="differences" type="button">差异</button>
      </div>

      <section id="nodesTab" class="tab-content active">
        <div class="panel-toolbar">
          <input id="nodeSearch" type="search" placeholder="筛选 tag / text">
          <span id="nodeSelectionCount" class="selection-count">0</span>
        </div>
        <div class="inline-actions">
          <select id="newElementType" aria-label="元素类型">
            <option value="TEXT">TEXT</option>
            <option value="IMAGE">IMAGE</option>
            <option value="ICON">ICON</option>
            <option value="SHAPE">SHAPE</option>
            <option value="INPUT">INPUT</option>
            <option value="BUTTON_VISUAL">BUTTON</option>
          </select>
          <button id="createElement" class="primary-button grow" type="button">创建元素</button>
        </div>
        <div id="nodeList" class="scroll-list"></div>
      </section>

      <section id="entitiesTab" class="tab-content">
        <div class="panel-toolbar">
          <strong>元素与分组</strong>
          <span id="entitySelectionCount" class="selection-count">0</span>
        </div>
        <button id="createGroup" class="primary-button full-button" type="button">创建分组</button>
        <div id="entityList" class="scroll-list"></div>
      </section>

      <section id="tokensTab" class="tab-content">
        <div class="panel-toolbar token-review-toolbar">
          <strong>样式候选</strong>
          <span id="tokenReviewStatus" class="status-badge">待检查</span>
        </div>
        <div id="tokenCandidateList" class="scroll-list token-candidate-list"></div>
        <button id="completeTokenReview" class="secondary-button full-button" type="button">完成 Token 检查</button>
        <details class="manual-token-editor">
          <summary>手动补充</summary>
          <div class="inline-actions">
            <select id="tokenKind" aria-label="Token 类型">
              <option value="COLOR">颜色</option>
              <option value="TEXT">文字</option>
              <option value="RADIUS">圆角</option>
              <option value="SPACING">间距</option>
            </select>
            <button id="createToken" class="primary-button grow" type="button">从所选实体创建</button>
          </div>
        </details>
        <div class="section-label token-result-label">已保留 Token</div>
        <div id="tokenList" class="scroll-list"></div>
      </section>

      <section id="differencesTab" class="tab-content">
        <div id="metricSummary" class="metric-summary"></div>
        <div class="panel-toolbar">
          <select id="differenceFilter" aria-label="差异类型">
            <option value="all">全部差异</option>
            <option value="elements">原子元素</option>
            <option value="groups">语义分组</option>
            <option value="tree">父子层级</option>
            <option value="layouts">布局约束</option>
            <option value="tokens">样式 Token</option>
          </select>
          <span id="differenceCount" class="selection-count">0</span>
        </div>
        <div id="differenceList" class="scroll-list difference-list"></div>
      </section>
    </aside>

    <section class="canvas-panel">
      <div class="canvas-toolbar">
        <label class="toggle-field">
          <input id="showAllNodes" type="checkbox" checked>
          <span>候选框</span>
        </label>
        <label class="toggle-field">
          <input id="showLabels" type="checkbox">
          <span>ID</span>
        </label>
        <div id="referenceControls" class="reference-controls hidden">
          <label class="toggle-field reference-human">
            <input id="showHumanReference" type="checkbox">
            <span>人工参考</span>
          </label>
          <label class="toggle-field reference-ai">
            <input id="showAiReference" type="checkbox" checked>
            <span>AI 参考</span>
          </label>
        </div>
        <div class="zoom-controls">
          <button id="zoomOut" class="icon-button" type="button" title="缩小" aria-label="缩小">−</button>
          <output id="zoomValue">100%</output>
          <button id="zoomIn" class="icon-button" type="button" title="放大" aria-label="放大">+</button>
          <button id="fitCanvas" class="secondary-button" type="button">适配</button>
        </div>
      </div>
      <div id="canvasViewport" class="canvas-viewport">
        <div id="canvasStage" class="canvas-stage">
          <img id="pageScreenshot" alt="">
          <div id="nodeOverlay" class="node-overlay"></div>
          <div id="referenceOverlay" class="reference-overlay"></div>
          <div id="entityOverlay" class="entity-overlay"></div>
        </div>
      </div>
    </section>

    <aside class="right-panel">
      <div class="inspector-heading">
        <div>
          <span class="eyebrow">属性</span>
          <strong id="inspectorTitle">未选择实体</strong>
        </div>
        <button id="deleteEntity" class="danger-button hidden" type="button">删除</button>
      </div>
      <div id="inspectorEmpty" class="empty-state">选择元素、分组或 Token</div>
      <form id="entityInspector" class="inspector-form hidden"></form>
      <form id="tokenInspector" class="inspector-form hidden"></form>
      <section id="adjudicationPanel" class="adjudication-panel hidden">
        <div class="review-status-row">
          <strong>人工审核</strong>
          <span id="reviewStatus" class="status-badge">待审核</span>
        </div>
        <label>
          <span>审核人标识</span>
          <input id="reviewerName" autocomplete="name" placeholder="填写真实审核人姓名或编号">
        </label>
        <label>
          <span>审核说明</span>
          <textarea id="reviewNotes" placeholder="记录主要分歧、采用依据和重新标注内容"></textarea>
        </label>
        <div id="reviewMeta" class="review-meta"></div>
      </section>
      <section class="validation-panel">
        <div class="validation-heading">
          <strong>校验</strong>
          <span id="validationCount">0</span>
        </div>
        <div id="validationList" class="validation-list"></div>
      </section>
    </aside>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
