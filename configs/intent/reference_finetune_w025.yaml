experiment:
  name: intent-reference-finetune-w025-v2
  output_dir: outputs/intent-reference-finetune-w025-v2
  seed: 42
data:
  dataset_kind: reference
  data_dir: data/processed
  package_dir: data/annotations/intent_gold_v1
  source_split_manifest: data/intent_pilot_split.json
  train_tiers: [human_gold, ai_silver]
  validation_tiers: [human_gold, ai_silver]
  verify_hashes: true
  max_nodes: 192
model:
  dim: 256
  freeze_visual: true
  freeze_text: true
  code_model_path: null
  visual_model_name: null
  use_visual: true
  use_text: true
  use_tags: true
  use_structured: true
  use_dom_graph: true
training:
  init_checkpoint: outputs/intent-full-v2/best.pt
  epochs: 15
  batch_size: 1
  grad_accum: 4
  learning_rate: 5.0e-5
  weight_decay: 0.01
  grad_clip: 1.0
  reference_tier_weights:
    human_gold: 1.0
    ai_silver: 0.25
  model_selection_tier: ai_silver
  loss_weights:
    action: 1.0
    element: 0.8
    group: 0.8
    role: 0.3
    layout_mode: 0.5
    layout_reg: 0.3
    layout_align: 0.2
    token: 0.5
    tree: 0.8
    align: 0.2
