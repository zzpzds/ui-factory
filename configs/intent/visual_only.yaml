experiment:
  name: intent-visual-only-v1
  output_dir: outputs/intent-visual-only-v1
  seed: 42
data:
  data_dir: data/sampled
  annotation_name: weak_intent.json
  max_nodes: 192
  split_manifest: data/intent_split.json
model:
  dim: 256
  freeze_visual: true
  freeze_text: true
  code_model_path: null
  visual_model_name: null
  use_visual: true
  use_text: false
  use_tags: false
  use_structured: false
  use_dom_graph: false
training:
  init_checkpoint: null
  epochs: 30
  batch_size: 1
  grad_accum: 4
  learning_rate: 2.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  loss_weights:
    align: 0.2
